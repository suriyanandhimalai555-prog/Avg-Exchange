apiVersion: apps/v1
kind: Deployment
metadata:
  name: avgexchange-backend
  namespace: avgexchange

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2

  minReadySeconds: 5
  progressDeadlineSeconds: 300

  selector:
    matchLabels:
      app: avgexchange-backend

  template:
    metadata:
      labels:
        app: avgexchange-backend

    spec:
      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: backend
          image: ghcr.io/suriyanandhimalai555-prog/avg-exchange-backend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 4010
              protocol: TCP

          envFrom:
            - secretRef:
                name: avgexchange-backend-secret

          startupProbe:
            tcpSocket:
              port: 4010
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 4010
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            tcpSocket:
              port: 4010
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: avgexchange-backend
  namespace: avgexchange

spec:
  selector:
    app: avgexchange-backend

  ports:
    - name: http
      port: 4010
      targetPort: 4010
      protocol: TCP

  type: ClusterIP
