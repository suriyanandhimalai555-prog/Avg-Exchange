apiVersion: apps/v1
kind: Deployment
metadata:
  name: avgexchange-frontend
  namespace: avgexchange
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  minReadySeconds: 2
  progressDeadlineSeconds: 120

  selector:
    matchLabels:
      app: avgexchange-frontend

  template:
    metadata:
      labels:
        app: avgexchange-frontend

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: frontend
          image: ghcr.io/suriyanandhimalai555-prog/avg-exchange-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: avgexchange-frontend
  namespace: avgexchange

spec:
  selector:
    app: avgexchange-frontend

  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

  type: ClusterIP
