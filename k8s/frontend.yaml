apiVersion: apps/v1
kind: Deployment
metadata:
  name: avgexchange-frontend
  namespace: avgexchange
spec:
  replicas: 2
  selector:
    matchLabels:
      app: avgexchange-frontend
  template:
    metadata:
      labels:
        app: avgexchange-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/suriyanandhimalai555-prog/avg-exchange-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: avgexchange-frontend
  namespace: avgexchange
spec:
  selector:
    app: avgexchange-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
