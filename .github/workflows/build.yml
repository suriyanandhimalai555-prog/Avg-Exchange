name: Build and Push Avg Exchange Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/suriyanandhimalai555-prog
  VITE_API_URL: https://api.avgexchange.io

jobs:
  build:
    name: Build ARM64 Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================
      # BACKEND
      # ==========================
      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/avg-exchange-backend:latest
            ${{ env.IMAGE_PREFIX }}/avg-exchange-backend:${{ github.sha }}
          cache-from: type=gha,scope=avgexchange-backend
          cache-to: type=gha,mode=max,scope=avgexchange-backend

      # ==========================
      # FRONTEND
      # ==========================
      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/avg-exchange-frontend:latest
            ${{ env.IMAGE_PREFIX }}/avg-exchange-frontend:${{ github.sha }}
          cache-from: type=gha,scope=avgexchange-frontend
          cache-to: type=gha,mode=max,scope=avgexchange-frontend

      # ==========================
      # BOT
      # ==========================
      - name: Build Bot
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/avg-exchange-bot:latest
            ${{ env.IMAGE_PREFIX }}/avg-exchange-bot:${{ github.sha }}
          cache-from: type=gha,scope=avgexchange-bot
          cache-to: type=gha,mode=max,scope=avgexchange-bot

      - name: Build Summary
        run: |
          echo "======================================"
          echo "AVG EXCHANGE ARM64 BUILD SUCCESS"
          echo "======================================"
          echo "Architecture: linux/arm64"
          echo "Commit: ${{ github.sha }}"
          echo "API: ${{ env.VITE_API_URL }}"
          echo "======================================"
