name: Build and Push Avg Exchange Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/suriyanandhimalai555-prog
  VITE_API_URL: https://api.avgexchange.io

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}/avg-exchange-backend:latest
            ${{ env.IMAGE_PREFIX }}/avg-exchange-backend:${{ github.sha }}
          cache-from: type=gha,scope=avgexchange-backend
          cache-to: type=gha,mode=max,scope=avgexchange-backend

      # Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/avg-exchange-frontend:latest
            ${{ env.IMAGE_PREFIX }}/avg-exchange-frontend:${{ github.sha }}
          cache-from: type=gha,scope=avgexchange-frontend
          cache-to: type=gha,mode=max,scope=avgexchange-frontend

      # Bot
      - name: Build and Push Bot
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}/avg-exchange-bot:latest
            ${{ env.IMAGE_PREFIX }}/avg-exchange-bot:${{ github.sha }}
          cache-from: type=gha,scope=avgexchange-bot
          cache-to: type=gha,mode=max,scope=avgexchange-bot

      - name: Build Summary
        run: |
          echo "=========================================="
          echo "AVG EXCHANGE BUILD SUCCESSFUL"
          echo "=========================================="
          echo "Backend:"
          echo "${{ env.IMAGE_PREFIX }}/avg-exchange-backend:${{ github.sha }}"
          echo ""
          echo "Frontend:"
          echo "${{ env.IMAGE_PREFIX }}/avg-exchange-frontend:${{ github.sha }}"
          echo ""
          echo "Bot:"
          echo "${{ env.IMAGE_PREFIX }}/avg-exchange-bot:${{ github.sha }}"
          echo ""
          echo "Production API:"
          echo "${{ env.VITE_API_URL }}"
          echo "=========================================="
