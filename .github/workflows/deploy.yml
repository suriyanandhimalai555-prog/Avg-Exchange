name: Deploy Avg Exchange Kubernetes

on:
  workflow_run:
    workflows:
      - Build and Push Avg Exchange Images
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: avgexchange-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # DEPLOY TO KUBERNETES
      # ==========================================================

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          timeout: 30s
          command_timeout: 360s

          script: |
            set -e

            echo "========================================"
            echo "AVG EXCHANGE KUBERNETES DEPLOYMENT"
            echo "========================================"

            cd /home/ubuntu/Applications/Avg-Exchange

            SHA="${{ github.event.workflow_run.head_sha }}"

            echo "Commit: $SHA"

            # ==================================================
            # UPDATE VPS REPOSITORY
            # ==================================================

            echo "===== GIT ====="

            git fetch origin main --quiet
            git reset --hard origin/main --quiet

            # ==================================================
            # VERIFY KUBERNETES
            # ==================================================

            echo "===== VERIFY KUBERNETES ====="

            kubectl get namespace avgexchange

            # ==================================================
            # SHOW CURRENT IMAGES
            # ==================================================

            echo "===== CURRENT DEPLOYMENTS ====="

            kubectl get deployment \
              -n avgexchange \
              -o wide

            # ==================================================
            # UPDATE BACKEND
            # ==================================================

            echo "========================================"
            echo "UPDATING BACKEND"
            echo "========================================"

            kubectl set image deployment/avgexchange-backend \
              backend=ghcr.io/suriyanandhimalai555-prog/avg-exchange-backend:$SHA \
              -n avgexchange

            echo "===== WAITING FOR BACKEND ====="

            if ! kubectl rollout status deployment/avgexchange-backend \
              -n avgexchange \
              --timeout=300s; then

              echo "BACKEND ROLLOUT FAILED"
              echo "ROLLING BACK BACKEND"

              kubectl rollout undo deployment/avgexchange-backend \
                -n avgexchange

              kubectl rollout status deployment/avgexchange-backend \
                -n avgexchange \
                --timeout=300s || true

              exit 1
            fi

            echo "===== BACKEND STATUS ====="

            kubectl get deployment avgexchange-backend \
              -n avgexchange

            kubectl get pods \
              -n avgexchange \
              -l app=avgexchange-backend \
              -o wide

            # ==================================================
            # BACKEND HEALTH
            # ==================================================

            echo "========================================"
            echo "BACKEND HEALTH CHECK"
            echo "========================================"

            BACKEND_HEALTH_OK=false

            for i in $(seq 1 10); do

              if curl -fsS \
                --connect-timeout 5 \
                --max-time 10 \
                https://api.avgexchange.io/health; then

                echo
                echo "Backend health check PASSED"
                BACKEND_HEALTH_OK=true
                break

              fi

              echo "Backend health check attempt $i failed"
              echo "Retrying in 5 seconds..."

              sleep 5
            done

            if [ "$BACKEND_HEALTH_OK" != "true" ]; then

              echo "Backend public health check FAILED"
              echo "ROLLING BACK BACKEND"

              kubectl rollout undo deployment/avgexchange-backend \
                -n avgexchange

              kubectl rollout status deployment/avgexchange-backend \
                -n avgexchange \
                --timeout=300s || true

              exit 1
            fi

            # ==================================================
            # UPDATE FRONTEND
            # ==================================================

            echo "========================================"
            echo "UPDATING FRONTEND"
            echo "========================================"

            kubectl set image deployment/avgexchange-frontend \
              frontend=ghcr.io/suriyanandhimalai555-prog/avg-exchange-frontend:$SHA \
              -n avgexchange

            echo "===== WAITING FOR FRONTEND ====="

            if ! kubectl rollout status deployment/avgexchange-frontend \
              -n avgexchange \
              --timeout=120s; then

              echo "FRONTEND ROLLOUT FAILED"
              echo "ROLLING BACK FRONTEND"

              kubectl rollout undo deployment/avgexchange-frontend \
                -n avgexchange

              kubectl rollout status deployment/avgexchange-frontend \
                -n avgexchange \
                --timeout=120s || true

              exit 1
            fi

            echo "===== FRONTEND STATUS ====="

            kubectl get deployment avgexchange-frontend \
              -n avgexchange

            kubectl get pods \
              -n avgexchange \
              -l app=avgexchange-frontend \
              -o wide

            # ==================================================
            # FRONTEND HEALTH
            # ==================================================

            echo "========================================"
            echo "FRONTEND HEALTH CHECK"
            echo "========================================"

            FRONTEND_HEALTH_OK=false

            for i in $(seq 1 10); do

              if curl -fsSI \
                --connect-timeout 5 \
                --max-time 10 \
                https://avgexchange.io/; then

                echo
                echo "Frontend health check PASSED"
                FRONTEND_HEALTH_OK=true
                break

              fi

              echo "Frontend health check attempt $i failed"
              echo "Retrying in 5 seconds..."

              sleep 5
            done

            if [ "$FRONTEND_HEALTH_OK" != "true" ]; then

              echo "Frontend public health check FAILED"
              echo "ROLLING BACK FRONTEND"

              kubectl rollout undo deployment/avgexchange-frontend \
                -n avgexchange

              kubectl rollout status deployment/avgexchange-frontend \
                -n avgexchange \
                --timeout=120s || true

              exit 1
            fi

            # ==================================================
            # UPDATE BOT
            # ==================================================

            echo "========================================"
            echo "UPDATING BOT"
            echo "========================================"

            kubectl set image deployment/avgexchange-bot \
              bot=ghcr.io/suriyanandhimalai555-prog/avg-exchange-bot:$SHA \
              -n avgexchange

            echo "===== WAITING FOR BOT ====="

            if ! kubectl rollout status deployment/avgexchange-bot \
              -n avgexchange \
              --timeout=120s; then

              echo "BOT ROLLOUT FAILED"
              echo "ROLLING BACK BOT"

              kubectl rollout undo deployment/avgexchange-bot \
                -n avgexchange

              kubectl rollout status deployment/avgexchange-bot \
                -n avgexchange \
                --timeout=120s || true

              exit 1
            fi

            echo "===== BOT STATUS ====="

            kubectl get deployment avgexchange-bot \
              -n avgexchange

            kubectl get pods \
              -n avgexchange \
              -l app=avgexchange-bot \
              -o wide

            # ==================================================
            # FINAL HEALTH CHECK
            # ==================================================

            echo "========================================"
            echo "FINAL HEALTH CHECK"
            echo "========================================"

            curl -fsS \
              --connect-timeout 5 \
              --max-time 10 \
              https://api.avgexchange.io/health

            echo

            curl -fsSI \
              --connect-timeout 5 \
              --max-time 10 \
              https://avgexchange.io/

            # ==================================================
            # FINAL STATUS
            # ==================================================

            echo "========================================"
            echo "FINAL DEPLOYMENT STATUS"
            echo "========================================"

            kubectl get deployment \
              -n avgexchange

            echo "===== POD STATUS ====="

            kubectl get pods \
              -n avgexchange \
              -o wide

            echo "===== SERVICES ====="

            kubectl get svc \
              -n avgexchange

            echo "===== INGRESS ====="

            kubectl get ingress \
              -n avgexchange

            echo "========================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "========================================"

      # ==========================================================
      # SUCCESS EMAIL
      # ==========================================================

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_USERNAME }}

          subject: "✅ Avg Exchange Deployment Successful"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <html>
            <body>

            <h2 style="color:green;">
              ✅ Avg Exchange Deployment Successful
            </h2>

            <table border="1"
                   cellpadding="8"
                   cellspacing="0"
                   style="border-collapse:collapse;">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.event.workflow_run.repository.full_name }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>main</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.event.workflow_run.head_sha }}</td>
              </tr>

              <tr>
                <td><b>Platform</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Deployment</b></td>
                <td>Kubernetes / k3s</td>
              </tr>

              <tr>
                <td><b>Namespace</b></td>
                <td>avgexchange</td>
              </tr>
              <tr>
                <td><b>Status</b></td>
                <td>Deployment Successful ✅</td>
              </tr>

            </table>

            <br>

            <p>
              The latest Avg Exchange images were successfully deployed
              to the Kubernetes cluster.
            </p>

            </body>
            </html>

      # ==========================================================
      # FAILURE EMAIL
      # ==========================================================

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_USERNAME }}

          subject: "❌ Avg Exchange Deployment Failed"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <html>
            <body>

            <h2 style="color:red;">
              ❌ Avg Exchange Deployment Failed
            </h2>

            <table border="1"
                   cellpadding="8"
                   cellspacing="0"
                   style="border-collapse:collapse;">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.event.workflow_run.repository.full_name }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>main</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.event.workflow_run.head_sha }}</td>
              </tr>

              <tr>
                <td><b>Platform</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Deployment</b></td>
                <td>Kubernetes / k3s</td>
              </tr>

              <tr>
                <td><b>Namespace</b></td>
                <td>avgexchange</td>
              </tr>
              <tr>
                <td><b>Status</b></td>
                <td>Deployment Failed ❌</td>
              </tr>

            </table>

            <br>

            <p>
              Deployment failed. Kubernetes rollback was attempted
              automatically for the failed component.
            </p>

            </body>
            </html>
