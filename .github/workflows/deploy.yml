name: Deploy Avg Exchange Kubernetes

on:
  workflow_run:
    workflows:
      - Build and Push Avg Exchange Images
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m

          script: |
            set -e

            echo "========================================"
            echo "Deploying Avg Exchange to Kubernetes"
            echo "========================================"

            cd /home/ubuntu/Applications/Avg-Exchange

            echo "===== GIT ====="
            git fetch origin main
            git reset --hard origin/main

            echo "===== NAMESPACE ====="
            kubectl get namespace avgexchange

            echo "===== GHCR SECRET ====="
            kubectl get secret ghcr-secret -n avgexchange

            echo "===== APPLY KUBERNETES MANIFESTS ====="
            kubectl apply -f k8s/backend.yaml
            kubectl apply -f k8s/frontend.yaml
            kubectl apply -f k8s/bot.yaml
            kubectl apply -f k8s/ingress.yaml

            echo "===== UPDATE IMAGES ====="

            kubectl set image deployment/avgexchange-backend \
              backend=ghcr.io/suriyanandhimalai555-prog/avg-exchange-backend:${{ github.event.workflow_run.head_sha }} \
              -n avgexchange

            kubectl set image deployment/avgexchange-frontend \
              frontend=ghcr.io/suriyanandhimalai555-prog/avg-exchange-frontend:${{ github.event.workflow_run.head_sha }} \
              -n avgexchange

            kubectl set image deployment/avgexchange-bot \
              bot=ghcr.io/suriyanandhimalai555-prog/avg-exchange-bot:${{ github.event.workflow_run.head_sha }} \
              -n avgexchange

            echo "===== WAIT FOR ROLLOUT ====="

            kubectl rollout status deployment/avgexchange-backend \
              -n avgexchange \
              --timeout=300s

            kubectl rollout status deployment/avgexchange-frontend \
              -n avgexchange \
              --timeout=300s

            kubectl rollout status deployment/avgexchange-bot \
              -n avgexchange \
              --timeout=300s

            echo "===== PODS ====="
            kubectl get pods -n avgexchange -o wide

            echo "===== SERVICES ====="
            kubectl get svc -n avgexchange

            echo "===== INGRESS ====="
            kubectl get ingress -n avgexchange

            echo "========================================"
            echo "Kubernetes Deployment Successful"
            echo "========================================"

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_USERNAME }}

          subject: "✅ Avg Exchange Kubernetes Deployment Successful"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>✅ Avg Exchange Kubernetes Deployment Successful</h2>

            <table border="1" cellpadding="8" cellspacing="0"
                   style="border-collapse:collapse;">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.event.workflow_run.repository.full_name }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>main</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.event.workflow_run.head_sha }}</td>
              </tr>

              <tr>
                <td><b>Deployment</b></td>
                <td>Kubernetes / k3s</td>
              </tr>

              <tr>
                <td><b>Namespace</b></td>
                <td>avgexchange</td>
              </tr>

              <tr>
                <td><b>Domain</b></td>
                <td>avgexchange.io</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>Deployment Successful ✅</td>
              </tr>

            </table>

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_USERNAME }}

          subject: "❌ Avg Exchange Kubernetes Deployment Failed"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>❌ Avg Exchange Kubernetes Deployment Failed</h2>

            <table border="1" cellpadding="8" cellspacing="0"
                   style="border-collapse:collapse;">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.event.workflow_run.repository.full_name }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>main</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.event.workflow_run.head_sha }}</td>
              </tr>

              <tr>
                <td><b>Deployment</b></td>
                <td>Kubernetes / k3s</td>
              </tr>

              <tr>
                <td><b>Namespace</b></td>
                <td>avgexchange</td>
              </tr>

              <tr>
                <td><b>Domain</b></td>
                <td>avgexchange.io</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>Deployment Failed ❌</td>
              </tr>

            </table>

            <br>

            <b>Please check GitHub Actions deployment logs.</b>
