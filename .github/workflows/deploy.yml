name: Deploy Avg Exchange

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS VPS
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. Checkout Repository
      # ========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ========================================
      # 2. Verify Required Secrets
      # ========================================
      - name: Verify Deployment Configuration
        run: |
          echo "========================================"
          echo "Avg Exchange Deployment"
          echo "========================================"

          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "ERROR: VPS_HOST secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "ERROR: VPS_USER secret is missing"
            exit 1
          fi

          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ERROR: VPS_SSH_KEY secret is missing"
            exit 1
          fi

          echo "AWS VPS Host: configured"
          echo "AWS VPS User: configured"
          echo "SSH Key: configured"
          echo "Deployment configuration looks good"

      # ========================================
      # 3. Deploy to AWS VPS
      # ========================================
      - name: Deploy to AWS VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          debug: false

          script: |
            set -e

            echo "========================================"
            echo "Starting Avg Exchange Deployment"
            echo "========================================"

            echo "Server:"
            hostname

            echo "User:"
            whoami

            echo "Current directory:"
            pwd

            echo "========================================"
            echo "Changing to application directory"
            echo "========================================"

            cd /home/ubuntu/Applications/Avg-Exchange

            echo "Application directory:"
            pwd

            echo "========================================"
            echo "Updating source code"
            echo "========================================"

            git fetch origin main
            git reset --hard origin/main

            echo "Current commit:"
            git rev-parse --short HEAD

            echo "========================================"
            echo "Stopping existing containers"
            echo "========================================"

            docker compose down

            echo "========================================"
            echo "Building Docker images"
            echo "========================================"

            docker compose build --no-cache

            echo "========================================"
            echo "Starting Docker containers"
            echo "========================================"

            docker compose up -d

            echo "========================================"
            echo "Waiting for containers"
            echo "========================================"

            sleep 10

            echo "========================================"
            echo "Docker Compose Status"
            echo "========================================"

            docker compose ps

            echo "========================================"
            echo "Docker Container Status"
            echo "========================================"

            docker ps

            echo "========================================"
            echo "Backend Health Check"
            echo "========================================"

            if curl -fsS http://127.0.0.1:4010/api/markets > /dev/null; then
              echo "Backend API is healthy"
            else
              echo "ERROR: Backend API health check failed"
              echo "Backend logs:"
              docker compose logs --tail=100 backend
              exit 1
            fi

            echo "========================================"
            echo "Frontend Check"
            echo "========================================"

            if curl -fsS http://127.0.0.1:3005 > /dev/null; then
              echo "Frontend is healthy"
            else
              echo "ERROR: Frontend health check failed"
              echo "Frontend logs:"
              docker compose logs --tail=100 frontend
              exit 1
            fi

            echo "========================================"
            echo "Deployment Completed Successfully"
            echo "========================================"

      # ========================================
      # 4. Send Success Email
      # ========================================
      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_USERNAME }}

          subject: "✅ Avg Exchange Deployment Successful"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>✅ Avg Exchange Deployment Successful</h2>

            <table border="1" cellpadding="8" cellspacing="0"
                   style="border-collapse:collapse;">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Workflow</b></td>
                <td>${{ github.workflow }}</td>
              </tr>

              <tr>
                <td><b>Server</b></td>
                <td>AWS VPS</td>
              </tr>

              <tr>
                <td><b>Backend</b></td>
                <td>Docker :4010</td>
              </tr>

              <tr>
                <td><b>Frontend</b></td>
                <td>Docker :3005</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>Deployment Successful ✅</td>
              </tr>

            </table>

      # ========================================
      # 5. Send Failure Email
      # ========================================
      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_USERNAME }}

          subject: "❌ Avg Exchange Deployment Failed"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <h2>❌ Avg Exchange Deployment Failed</h2>

            <table border="1" cellpadding="8" cellspacing="0"
                   style="border-collapse:collapse;">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.repository }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>${{ github.ref_name }}</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.sha }}</td>
              </tr>

              <tr>
                <td><b>Developer</b></td>
                <td>${{ github.actor }}</td>
              </tr>

              <tr>
                <td><b>Workflow</b></td>
                <td>${{ github.workflow }}</td>
              </tr>

              <tr>
                <td><b>Server</b></td>
                <td>AWS VPS</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>Deployment Failed ❌</td>
              </tr>

            </table>

            <br>

            <b>Please check the GitHub Actions deployment logs.</b>
