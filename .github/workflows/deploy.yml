name: Deploy Avg Exchange Kubernetes

on:
  workflow_run:
    workflows:
      - Build and Push Avg Exchange Images
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          timeout: 30s
          command_timeout: 120s

          script: |
            set -e

            echo "========================================"
            echo "AVG EXCHANGE KUBERNETES DEPLOYMENT"
            echo "========================================"

            cd /home/ubuntu/Applications/Avg-Exchange

            SHA="${{ github.event.workflow_run.head_sha }}"

            echo "Commit: $SHA"

            echo "===== GIT ====="
            git fetch origin main --quiet
            git reset --hard origin/main --quiet

            echo "===== VERIFY NAMESPACE ====="
            kubectl get namespace avgexchange

            echo "===== APPLY MANIFESTS ====="
            kubectl apply -f k8s/backend.yaml
            kubectl apply -f k8s/frontend.yaml
            kubectl apply -f k8s/bot.yaml
            kubectl apply -f k8s/ingress.yaml

            echo "===== UPDATE BACKEND ====="
            kubectl set image deployment/avgexchange-backend \
              backend=ghcr.io/suriyanandhimalai555-prog/avg-exchange-backend:${SHA} \
              -n avgexchange

            echo "===== UPDATE FRONTEND ====="
            kubectl set image deployment/avgexchange-frontend \
              frontend=ghcr.io/suriyanandhimalai555-prog/avg-exchange-frontend:${SHA} \
              -n avgexchange

            echo "===== UPDATE BOT ====="
            kubectl set image deployment/avgexchange-bot \
              bot=ghcr.io/suriyanandhimalai555-prog/avg-exchange-bot:${SHA} \
              -n avgexchange

            echo "===== WAIT BACKEND ====="
            kubectl rollout status deployment/avgexchange-backend \
              -n avgexchange \
              --timeout=90s

            echo "===== WAIT FRONTEND ====="
            kubectl rollout status deployment/avgexchange-frontend \
              -n avgexchange \
              --timeout=60s

            echo "===== WAIT BOT ====="
            kubectl rollout status deployment/avgexchange-bot \
              -n avgexchange \
              --timeout=60s

            echo "===== DEPLOYMENT STATUS ====="
            kubectl get deployment -n avgexchange

            echo "===== POD STATUS ====="
            kubectl get pods -n avgexchange -o wide

            echo "========================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "========================================"

      # ==========================================================
      # SUCCESS EMAIL
      # ==========================================================

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_USERNAME }}

          subject: "✅ Avg Exchange Deployment Successful"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <html>
            <body>

            <h2 style="color:green;">
              ✅ Avg Exchange Deployment Successful
            </h2>

            <table border="1"
                   cellpadding="8"
                   cellspacing="0"
                   style="border-collapse:collapse;">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.event.workflow_run.repository.full_name }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>main</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.event.workflow_run.head_sha }}</td>
              </tr>

              <tr>
                <td><b>Platform</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Deployment</b></td>
                <td>Kubernetes / k3s</td>
              </tr>

              <tr>
                <td><b>Namespace</b></td>
                <td>avgexchange</td>
              </tr>

              <tr>
                <td><b>Domain</b></td>
                <td>avgexchange.io</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>Deployment Successful ✅</td>
              </tr>

            </table>

            <br>

            <p>
              The latest Avg Exchange images were successfully deployed
              to the Kubernetes cluster.
            </p>

            </body>
            </html>

      # ==========================================================
      # FAILURE EMAIL
      # ==========================================================

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          from: ${{ secrets.SMTP_USERNAME }}

          subject: "❌ Avg Exchange Deployment Failed"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com

          html_body: |
            <html>
            <body>

            <h2 style="color:red;">
              ❌ Avg Exchange Deployment Failed
            </h2>

            <table border="1"
                   cellpadding="8"
                   cellspacing="0"
                   style="border-collapse:collapse;">

              <tr>
                <td><b>Repository</b></td>
                <td>${{ github.event.workflow_run.repository.full_name }}</td>
              </tr>

              <tr>
                <td><b>Branch</b></td>
                <td>main</td>
              </tr>

              <tr>
                <td><b>Commit</b></td>
                <td>${{ github.event.workflow_run.head_sha }}</td>
              </tr>

              <tr>
                <td><b>Platform</b></td>
                <td>ARM64</td>
              </tr>

              <tr>
                <td><b>Deployment</b></td>
                <td>Kubernetes / k3s</td>
              </tr>

              <tr>
                <td><b>Namespace</b></td>
                <td>avgexchange</td>
              </tr>

              <tr>
                <td><b>Domain</b></td>
                <td>avgexchange.io</td>
              </tr>

              <tr>
                <td><b>Status</b></td>
                <td>Deployment Failed ❌</td>
              </tr>

            </table>

            <br>

            <p>
              Please check the GitHub Actions deployment logs
              for the exact Kubernetes error.
            </p>

            </body>
            </html>
