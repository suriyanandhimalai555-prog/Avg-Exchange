name: Deploy Avg Exchange Kubernetes

on:
workflow_run:
workflows:
- Build and Push Avg Exchange Images
types:
- completed
branches:
- main

permissions:
contents: read

concurrency:
group: avgexchange-production-deploy
cancel-in-progress: false

jobs:
deploy:
if: ${{ github.event.workflow_run.conclusion == 'success' }}

```
name: Deploy to Kubernetes
runs-on: ubuntu-latest

steps:
  - name: Deploy to Kubernetes
    uses: appleboy/ssh-action@v1.2.2
    with:
      host: ${{ secrets.VPS_HOST }}
      username: ${{ secrets.VPS_USER }}
      key: ${{ secrets.VPS_SSH_KEY }}
      port: 22
      timeout: 30s
      command_timeout: 360s

      script: |
        set -e

        cd /home/ubuntu/Applications/Avg-Exchange

        SHA="${{ github.event.workflow_run.head_sha }}"

        echo "========================================"
        echo "AVG EXCHANGE KUBERNETES DEPLOYMENT"
        echo "Commit: $SHA"
        echo "========================================"

        git fetch origin main --quiet
        git reset --hard origin/main --quiet

        kubectl get namespace avgexchange

        echo "===== CURRENT DEPLOYMENTS ====="
        kubectl get deployment -n avgexchange -o wide

        echo "===== UPDATING BACKEND ====="

        kubectl set image deployment/avgexchange-backend \
          backend=ghcr.io/suriyanandhimalai555-prog/avg-exchange-backend:$SHA \
          -n avgexchange

        if ! kubectl rollout status deployment/avgexchange-backend \
          -n avgexchange \
          --timeout=180s; then

          echo "BACKEND ROLLOUT FAILED"
          echo "ROLLING BACK BACKEND"

          kubectl rollout undo deployment/avgexchange-backend \
            -n avgexchange

          kubectl rollout status deployment/avgexchange-backend \
            -n avgexchange \
            --timeout=180s || true

          exit 1
        fi

        echo "===== BACKEND HEALTH CHECK ====="

        BACKEND_HEALTH_OK=false

        for i in $(seq 1 10); do
          if curl -fsS \
            --connect-timeout 5 \
            --max-time 10 \
            https://api.avgexchange.io/health; then

            echo
            BACKEND_HEALTH_OK=true
            break
          fi

          echo "Backend health check attempt $i failed"
          sleep 5
        done

        if [ "$BACKEND_HEALTH_OK" != "true" ]; then

          echo "BACKEND HEALTH CHECK FAILED"
          echo "ROLLING BACK BACKEND"

          kubectl rollout undo deployment/avgexchange-backend \
            -n avgexchange

          kubectl rollout status deployment/avgexchange-backend \
            -n avgexchange \
            --timeout=180s || true

          exit 1
        fi

        echo "===== UPDATING FRONTEND ====="

        kubectl set image deployment/avgexchange-frontend \
          frontend=ghcr.io/suriyanandhimalai555-prog/avg-exchange-frontend:$SHA \
          -n avgexchange

        if ! kubectl rollout status deployment/avgexchange-frontend \
          -n avgexchange \
          --timeout=120s; then

          echo "FRONTEND ROLLOUT FAILED"
          echo "ROLLING BACK FRONTEND"

          kubectl rollout undo deployment/avgexchange-frontend \
            -n avgexchange

          kubectl rollout status deployment/avgexchange-frontend \
            -n avgexchange \
            --timeout=120s || true

          exit 1
        fi

        echo "===== FRONTEND HEALTH CHECK ====="

        FRONTEND_HEALTH_OK=false

        for i in $(seq 1 10); do
          if curl -fsSI \
            --connect-timeout 5 \
            --max-time 10 \
            https://avgexchange.io/; then

            echo
            FRONTEND_HEALTH_OK=true
            break
          fi

          echo "Frontend health check attempt $i failed"
          sleep 5
        done

        if [ "$FRONTEND_HEALTH_OK" != "true" ]; then

          echo "FRONTEND HEALTH CHECK FAILED"
          echo "ROLLING BACK FRONTEND"

          kubectl rollout undo deployment/avgexchange-frontend \
            -n avgexchange

          kubectl rollout status deployment/avgexchange-frontend \
            -n avgexchange \
            --timeout=120s || true

          exit 1
        fi

        echo "===== UPDATING BOT ====="

        kubectl set image deployment/avgexchange-bot \
          bot=ghcr.io/suriyanandhimalai555-prog/avg-exchange-bot:$SHA \
          -n avgexchange

        if ! kubectl rollout status deployment/avgexchange-bot \
          -n avgexchange \
          --timeout=120s; then

          echo "BOT ROLLOUT FAILED"
          echo "ROLLING BACK BOT"

          kubectl rollout undo deployment/avgexchange-bot \
            -n avgexchange

          kubectl rollout status deployment/avgexchange-bot \
            -n avgexchange \
            --timeout=120s || true

          exit 1
        fi

        echo "===== FINAL HEALTH CHECK ====="

        curl -fsS \
          --connect-timeout 5 \
          --max-time 10 \
          https://api.avgexchange.io/health

        echo

        curl -fsSI \
          --connect-timeout 5 \
          --max-time 10 \
          https://avgexchange.io/

        echo "===== DEPLOYMENT STATUS ====="

        kubectl get deployment -n avgexchange
        kubectl get pods -n avgexchange -o wide
        kubectl get svc -n avgexchange
        kubectl get ingress -n avgexchange

        echo "========================================"
        echo "AVG EXCHANGE DEPLOYMENT SUCCESSFUL"
        echo "========================================"

  - name: Send Success Email
    if: success()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: ${{ secrets.SMTP_SERVER }}
      server_port: ${{ secrets.SMTP_PORT }}
      secure: true
      username: ${{ secrets.SMTP_USERNAME }}
      password: ${{ secrets.SMTP_PASSWORD }}
      from: ${{ secrets.SMTP_USERNAME }}

      subject: "✅ Avg Exchange Kubernetes Deployment Successful"

      to: |
        Sanjayvanan03@gmail.com,
        muthukdm45@gmail.com,
        deepakavgprimetech@gmail.com

      html_body: |
        <html>
        <body>

        <h2>✅ Avg Exchange Kubernetes Deployment Successful</h2>

        <ul>
          <li>✅ Docker images built</li>
          <li>✅ Images pushed to GHCR</li>
          <li>✅ Kubernetes manifests/deployments updated</li>
          <li>✅ Kubernetes rolling update completed</li>
          <li>✅ Backend rollout verified</li>
          <li>✅ Frontend rollout verified</li>
          <li>✅ Bot rollout verified</li>
          <li>✅ Backend health check passed</li>
          <li>✅ Frontend health check passed</li>
          <li>✅ Final health checks passed</li>
          <li>✅ Zero-downtime rolling deployment verified</li>
          <li>✅ Deployment successful</li>
        </ul>

        <p>
          <strong>Repository:</strong>
          ${{ github.event.workflow_run.repository.full_name }}
        </p>

        <p>
          <strong>Branch:</strong>
          main
        </p>

        <p>
          <strong>Image Tag:</strong>
          ${{ github.event.workflow_run.head_sha }}
        </p>

        <p>
          <strong>Platform:</strong>
          ARM64
        </p>

        <p>
          <strong>Deployment:</strong>
          Kubernetes / k3s
        </p>

        <p>
          <strong>Namespace:</strong>
          avgexchange
        </p>

        <p>
          <strong>Domain:</strong>
          avgexchange.io
        </p>

        </body>
        </html>

  - name: Send Failure Email
    if: failure()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: ${{ secrets.SMTP_SERVER }}
      server_port: ${{ secrets.SMTP_PORT }}
      secure: true
      username: ${{ secrets.SMTP_USERNAME }}
      password: ${{ secrets.SMTP_PASSWORD }}
      from: ${{ secrets.SMTP_USERNAME }}

      subject: "❌ Avg Exchange Kubernetes Deployment Failed"

      to: |
        Sanjayvanan03@gmail.com,
        muthukdm45@gmail.com,
        deepakavgprimetech@gmail.com

      html_body: |
        <html>
        <body>

        <h2>❌ Avg Exchange Kubernetes Deployment Failed</h2>

        <ul>
          <li>❌ Kubernetes deployment failed</li>
          <li>❌ Rollout or health verification failed</li>
          <li>🔄 Automatic rollback was attempted</li>
          <li>📄 Check GitHub Actions logs</li>
        </ul>

        <p>
          <strong>Repository:</strong>
          ${{ github.event.workflow_run.repository.full_name }}
        </p>

        <p>
          <strong>Branch:</strong>
          main
        </p>

        <p>
          <strong>Image Tag:</strong>
          ${{ github.event.workflow_run.head_sha }}
        </p>

        <p>
          <strong>Platform:</strong>
          ARM64
        </p>

        <p>
          <strong>Deployment:</strong>
          Kubernetes / k3s
        </p>

        <p>
          <strong>Namespace:</strong>
          avgexchange
        </p>

        </body>
        </html>
```
